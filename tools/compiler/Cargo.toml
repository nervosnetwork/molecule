[package]
name = "moleculec"
version = "0.9.2"
authors = ["Nervos Core Dev <dev@nervos.org>"]
edition = "2021"
description = "Schema compiler for molecule."
homepage = "https://github.com/nervosnetwork/molecule"
repository = "https://github.com/nervosnetwork/molecule"
keywords = ["molecule", "code-generation", "serialization"]
categories = [
    "parser-implementations",
    "development-tools",
    "encoding",
    "data-structures",
]
license = "MIT"

[[bin]]
name = "moleculec"
path = "src/compiler.rs"

[[bin]]
name = "moleculec-c"
path = "src/compiler-c.rs"

[[bin]]
name = "moleculec-rust"
path = "src/compiler-rust.rs"

[[bin]]
name = "moleculec-rust-lazy-reader"
path = "src/compiler-rust-lazy-reader.rs"

[dependencies]
clap = { version = "4", features = ["cargo", "string"] }
which = "6"
# `tracing` is required for Windows builds because process-wrap 8.2.1's `job_object.rs`
# calls `tracing::debug!` unconditionally without a `#[cfg(feature = "tracing")]` guard.
process-wrap = { version = "=8.2.1", default-features = false, features = ["std", "process-group", "job-object", "tracing"] }
molecule-codegen = { version = "=0.9.2", path = "../codegen", features = [
    "compiler-plugin",
] }

[badges]
maintenance = { status = "experimental" }

[dev-dependencies]
tempfile = "=3.6.0"
