[workspace]
resolver = "2"
members = [
    "bindings/rust",
    "examples/ci-tests",
    "examples/lazy-reader-tests",
    "examples/tests-loader",
    "examples/tests-utils-c",
    "examples/tests-utils-rust",
    "fuzzing/rust",
    "tests",
    "tools/codegen",
    "tools/compiler",
]
default-members = [
    "bindings/rust",
    "examples/ci-tests",
    "tests",
    "tools/codegen",
    "tools/compiler",
]
exclude = [
    "examples/ci-tests/target",
    "examples/lazy-reader-tests/fuzz",
    "fuzzing/rust/fuzz",
]

[workspace.package]
version = "0.9.2"
authors = ["Nervos Core Dev <dev@nervos.org>"]
license = "MIT"
repository = "https://github.com/nervosnetwork/molecule"
homepage = "https://github.com/nervosnetwork/molecule"

[workspace.dependencies]
bytes = { version = "1.5.0", default-features = false }
case = "1.0.0"
cc = "1"
cfg-if = "1.0.0"
clap = { version = "4", features = ["cargo", "string"] }
codegen = { package = "molecule-codegen", path = "tools/codegen", version = "=0.9.2", features = ["compiler-plugin"] }
codegen-0_7_3 = { package = "molecule-codegen", version = "=0.7.3", features = ["compiler-plugin"] }
codegen_dev = { package = "molecule-codegen", path = "tools/codegen", version = "=0.9.2", features = ["compiler-plugin"] }
lazy_static = "1.4.0"
molecule = { path = "bindings/rust", version = "=0.9.2", default-features = false }
molecule_codegen = { package = "molecule-codegen", path = "tools/codegen", version = "=0.9.2", features = ["compiler-plugin"] }
molecule-tests-utils-rust = { path = "examples/tests-utils-rust", version = "=0.9.2" }
pest = "2.5.7"
pest_derive = "2.5.7"
proc-macro2 = "1.0.76"
property = "0.3.3"
proptest = "0.10.1"
quote = "1.0.35"
rand = "0.8.5"
same-file = "1.0.6"
semver = "0.11.0"
serde = { version = "1.0.195", features = ["derive", "rc"] }
serde_json = "1.0.111"
serde_yaml = "0.9"
slices = "0.1.1"
syn = "1.0.58"
tempfile = "=3.6.0"
tests-loader = { package = "molecule-tests-loader", path = "examples/tests-loader", version = "=0.9.2" }
which = "6"
